# Incluir dentro del VirtualHost HTTPS de grabador.imcyc.com.
RedirectMatch 308 ^/exp-imcyc$ /exp-imcyc/
RedirectMatch 302 ^/panel/?$ /exp-imcyc/panel/
Alias /exp-imcyc /var/www/html/exp-imcyc

<Directory /var/www/html/exp-imcyc>
    Options -Indexes -MultiViews +FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.html

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

    <FilesMatch "\.(html|txt)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
</Directory>

<Directory /var/www/html/exp-imcyc/_next/static>
    Header set Cache-Control "public, max-age=31536000, immutable"
</Directory>
